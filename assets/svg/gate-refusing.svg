<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" width="720" height="214" role="img" aria-labelledby="t">
  <title id="t">task finish checks CI, the routed reviewer's approval and any open human gate; when one is unmet it exits non-zero with a machine-readable refusal code.</title>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8a8aa0}
    .box{fill:#8a8aa0;fill-opacity:0.08;stroke:#8a8aa0;stroke-width:1.5}
    .m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.s{font-size:14px}.h{font-size:16px;font-weight:600}
    .ok{fill:#1ad1ff}.no{fill:#8a8aa0}
  </style>
  <rect rx="8" class="box" x="24" y="24" width="300" height="152"/>
  <text class="m" x="40" y="50" fill="#1ad1ff">$ gh codecrew task finish 42</text>
  <text class="h ok" x="40" y="82">✓</text><text class="s" x="62" y="82">CI required checks green</text>
  <text class="h ok" x="40" y="106">✓</text><text class="s" x="62" y="106">no cc:needs-decision open</text>
  <text class="h no" x="40" y="130">✗</text><text class="s" x="62" y="130">routed reviewer's approval</text>
  <text class="m" x="40" y="160">exit 1</text>
  <rect rx="8" class="box" x="348" y="24" width="348" height="152"/>
  <text class="s" x="364" y="50">stderr</text>
  <text class="m" x="364" y="80">refused[NO_HOLDER_REVIEW]: PR #57 has</text>
  <text class="m" x="364" y="100">no approving review from the reviewer</text>
  <text class="m" x="364" y="120">role's holder (radiusred-checky) — the</text>
  <text class="m" x="364" y="140">role defines whose review counts;</text>
  <text class="m" x="364" y="160">dispatch the reviewer (identities.md)</text>
  <text class="s" x="24" y="202">A code an agent can act on; a detail a human can read.</text>
</svg>
